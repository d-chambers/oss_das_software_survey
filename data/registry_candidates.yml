# ---- registries searched that yielded nothing ------------------------------
#
# Recorded because absence of candidates from a registry means nothing without
# a coverage statement -- the same reason discovery_coverage.csv exists.

coverage:
  pypi:
    searched: >-
      Complete Simple index, 880,040 names. 1,095 selected on DAS/DFOS/fiber/
      optic/seismic/acoustic/OTDR/DTS/TDMS/strain/sensing/interrogator tokens;
      1,050 JSON records fetched (45 index names have no JSON record); name +
      summary + description + keywords full-text scanned; 53 keyword hits all
      read by hand. Cross-checked against packages.ecosyste.ms keyword indexes
      and site:pypi.org web search.
    result: 11 new candidates.
    limit: >-
      pypi.org/search is behind a JavaScript bot challenge, which is why the
      index sweep replaced it. The sweep finds a package whose NAME carries a
      token, or whose description does once fetched. A neutral-named package
      never fetched stays invisible -- the Pyrocko hole. deltaseis was caught
      only by its self-declared keywords. Closing that hole completely means
      fetching 880k JSON records.
  conda_forge:
    searched: Full channeldata.json, 34,088 packages, summary + description + keywords.
    result: >-
      8 hits, all already recorded (dascore, daspy-toolbox, derzug,
      dtscalibration). Nothing new.
  julia_general:
    searched: Full Registry.toml, 14,237 packages, regex over every name.
    result: Zero DAS. Vendor terms (Febus, Silixa, OptaSense, Terra15, Sintela, OptoDAS, DASVader) have zero occurrences in the entire registry.
    corollary: >-
      The catalogued DASVader.jl and FebusTools.jl are NOT registered in
      General. The Julia column measures registration, not existence -- do not
      read it as ecosystem size.
  cran:
    searched: Full crandb dump, 24,786 packages, full-text over Title + Description.
    result: Zero DAS/DFOS. Nearest misses are presens (PreSens fibre-optic oxygen transmitters) and fiberLD (tree fibre length).
    limit: R-universe /api/search is OR-ranked and unusable for phrase search; not relied on.
  matlab_file_exchange:
    searched: >-
      Quoted-phrase searches. FEX honours quotes -- a quoted miss returns "did
      not match any of the add-ons" while the same query unquoted returns
      thousands of OR-ranked hits.
    result: >-
      "distributed acoustic sensing" 0, "distributed temperature sensing" 0,
      "fiber optic sensing" 0, Silixa 0, OTDR 0. Bare DAS returns 114, all
      acronym collisions (the surname Das, delay-and-sum beamforming, index-1
      DAEs, DAS-CMOP test problems).
    note: >-
      The brief expected real finds here. There are none, and this is a
      measured zero over the registry rather than a failed search. MathWorks'
      own ExploreDAS is not on FEX: it ships as the software appendix to the
      SEG book, https://library.seg.org/doi/10.1190/1.9781560803850.app.
      Genuinely off-forge and off-registry; licence and separate
      downloadability not verified. Lead, not a candidate.
  crates_io:
    searched: 6 queries via the search API.
    result: Only otdrs (telecom SOR) and libgtr (above).
  maven_central:
    searched: 14 queries via solrsearch.
    result: Only the com.geosiris PRODML artifacts.
    limit: Maven search matches groupId/artifactId, not descriptions; a Java DAS library with a neutral coordinate is invisible to it.
  npm:
    searched: 5 queries, 25 results each.
    result: >-
      Zero DAS. Only fibre-optic packages are telecom OTDR SOR parsers
      (sor-reader, @diolan12/js-otdr, jsotdr, @ismaelvega/trace-otdr-ui).
  nuget:
    searched: 3 queries. Not in the brief; added because the OTDR trail led there.
    result: Telecom SOR readers only (CdIts.OtdrReader, CdIts.OtdrWriter, BaldrAI.OpenOTDR.OTDRFile).
  zenodo:
    searched: 6 phrase queries restricted to type=software. 42 records for "distributed acoustic sensing"; 25 most recent read plus every record declaring no forge link.
    result: >-
      Zero catalogue-eligible packages. Every off-forge record is
      paper-companion analysis code -- single zips or loose notebooks, several
      shipping environment.yml -- and so fails steps 4 and 5 of the test in
      candidate_triage.yml.
    note: >-
      This is a real corpus of DAS software a forge sweep cannot see, excluded
      by our own rules rather than by the search. Say so in the method:
      "we never searched a registry" should be replaced by a bounded claim, not
      by "we searched and found nothing".
    forge_leads: >-
      Zenodo also surfaced DAS repos on GitHub/GitLab that are not catalogued.
      These belong to the forge-triage backlog, not to this file, but they are
      cheap: xieyqgeo/DASBP_cc, Flinder010/Firn, Flinder010/RDM-DAS,
      tangle0129/DAS-quasi-static-deformation-modeling-and-inversion,
      JohannaZitt/CryoDASDenoising, niyiyu/DAS-reconstruction, syyuan93/das_veh,
      jacobrdavis/neural-network-based-methods-for-das-ocean-surface-wave-measurement,
      khencohen/DAS-for-Urban-Monitoring, gitlab.com/gitdeeper8/lithosonic.

# ---- checked and rejected --------------------------------------------------
#
# Recorded so the same names are not re-triaged next pass. Same spirit as
# rejected.yml, but keyed by package rather than forge_key, since several of
# these have no repository.

rejections:

  acronym_collision:
    reason: >-
      "DAS" here is an unrelated acronym or an ordinary word, not distributed
      acoustic sensing.
    packages:
      - das (janclemenslab Deep Audio Segmenter)
      - das_unsupervised (same author)
      - daspython (NIOZ Data Archive System client, git.nioz.nl)
      - das-cli (same NIOZ system; note npm has a different das-cli, Das Keyboard)
      - fast-das (delay-and-sum ultrasound beamforming)
      - das-generator (Dynamic Acoustic Scene Generator)
      - qdas-parser (Q-DAS industrial quality format)
      - SHIELD-DAS (permeation-rig data acquisition)
      - das2py (das2 space-physics protocol)
      - dascutils (UAF Digital All-Sky Camera)
      - pioneer-das-api / pioneer-das-view (LeddarTech autonomous-driving dataset)
      - hyperon-das (SingularityNET Distributed AtomSpace)
      - aliyun-python-sdk-das / alibabacloud-das20200116 / antchain-das
      - das-bridge (DAS Trader) / das-iboot / das-layer / das-llm / das-import
      - das-statistics / das-utils / der-die-das
      - 'org.wso2.das:* (WSO2 Data Analytics Server, 20 Maven artifacts)'
      - '@springernature/das-elements, @mettascript/das-client, @macalinao/das-api'
      - sfa.das.* (NuGet)
      - 'com.squareup:seismic (Android shake detection)'
    note: >-
      daspython/das-cli is the tempting one: institutional GitLab, an
      oceanographic institute, summary "DAS api client". It is NIOZ's Data
      Archive System. Worth keeping named so it is not rediscovered as a find.

  telecom_otdr_not_distributed_sensing:
    reason: >-
      Parses Telcordia SR-4731 / Bellcore SOR traces for cable fault location.
      Fibre optics, but characterisation rather than distributed sensing.
      Rejected deliberately rather than by omission -- if the census ever
      widens to fibre characterisation, this is a ready-made cluster across
      four registries.
    packages:
      - pyotdr (pypi)
      - otdrparser (pypi)
      - otdr-reader (pypi)
      - otdrs (pypi and cargo)
      - sor-reader (npm)
      - '@diolan12/js-otdr (npm)'
      - jsotdr (npm)
      - '@ismaelvega/trace-otdr-ui (npm)'
      - CdIts.OtdrReader (nuget)
      - CdIts.OtdrWriter (nuget)
      - BaldrAI.OpenOTDR.OTDRFile (nuget)

  empty_placeholder:
    reason: Name reserved, nothing shipped. Both would have been false positives on name alone; the wheels were opened.
    packages:
      - dasformer (0.1.0; wheel contains only dist-info/, no modules)
      - dasdetect (0.1; wheel contains only dist-info/, no modules)

  general_purpose_no_das_content:
    reason: Real software, no DAS-specific capability.
    packages:
      - npTDMS (generic LabView TDMS reader; Silixa iDAS writes TDMS, but the package is format-generic and never mentions DAS -- a dependency of DAS software, not DAS software)
      - dbscan1d (tagged distributed-acoustic-sensing on PyPI; is a general 1-D DBSCAN)
      - ofiber / anafibre / FiberNlse / OpticalFibers / MultilayerFiber (fibre propagation and mode solvers)
      - presens / fiberLD (CRAN)
