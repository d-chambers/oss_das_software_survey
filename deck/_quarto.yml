# `quarto render` is the whole build, and writes both outputs: talk.html to
# present from and talk.pdf as the backup. The pre-render step resolves the
# numbers the slides cite, proves each figure is the one those numbers describe,
# and converts hand-drawn SVGs -- three things quarto has no native way to do.
project:
  type: default
  pre-render: prepare.py
  output-dir: .

format:
  revealjs:
    output-file: talk.html
    embed-resources: true
    incremental: true
    theme: [default, ineris.scss]
    css: ineris.css
    width: 1280
    height: 720
    slide-number: true
    fig-align: center
    # Reveal's own vertical centring moves the whole section, and the title
    # rides with it, so a title sits at a different height on every slide.
    # The title is pinned instead and the content is centred beneath it, in
    # ineris.css -- same result, fixed title.
    center: false
    # A stretched figure fills the frame instead of sitting centred in it, and
    # reveal sizes it against a slide whose title it cannot see: the title is
    # absolutely positioned, so it measures as zero height and the figure is
    # given the whole slide. Each figure keeps the width its slide declares,
    # and the flex rule in ineris.css centres it.
    auto-stretch: false
    include-after-body: _logos.html
  beamer:
    output-file: talk.pdf
    aspectratio: 169
    # `c` so the PDF backup centres each frame the way reveal's `center: true`
    # centres the slide it was built from; the default hangs figures from the
    # title and leaves the slack at the bottom.
    classoption: [c]
    incremental: true
    include-in-header: _theme.tex
    slide-level: 2
    pdf-engine: pdflatex
    fig-align: center

metadata-files:
  - _numbers.yml
