<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1680" height="720" viewBox="0 0 1680 720">
  <title>Languages and packaging</title>
  <desc>595,505 lines across 13 languages; 61 of 78 catalogued projects publish no package.</desc>
  <rect x="0" y="0" width="1680" height="720" fill="#ffffff"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
