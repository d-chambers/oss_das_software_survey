<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1680" height="460" viewBox="0 0 1680 460">
  <title>Open-source DAS software in numbers</title>
  <desc>Snapshot 2026-08-28, in-scope catalogue: 73 projects, 120 contributors, 6,848 commits, 564,437 lines of code.</desc>

  <rect x="0" y="0" width="1680" height="460" fill="#ffffff"/>

  <!-- ================= icons ================= -->

  <!-- projects: a stack of repository cards -->
  <g>
    <rect x="141" y="50" width="106" height="84" rx="5" fill="#e4dccb"/>
    <rect x="157" y="68" width="106" height="84" rx="5" fill="#cbc3b3" stroke="#ffffff" stroke-width="6"/>
    <rect x="173" y="86" width="106" height="84" rx="5" fill="#f1ece1" stroke="#ffffff" stroke-width="6"/>
    <rect x="189" y="104" width="42" height="9" rx="4.5" fill="#c98500"/>
    <rect x="189" y="124" width="76" height="9" rx="4.5" fill="#b8b0a0"/>
    <rect x="189" y="142" width="54" height="9" rx="4.5" fill="#b8b0a0"/>
  </g>

  <!-- contributors: three figures, one foregrounded -->
  <g>
    <g fill="#cbc3b3">
      <circle cx="586" cy="80" r="18"/>
      <path d="M 554,168 V 152 a 32,27 0 0 1 64,0 v 16 z"/>
      <circle cx="674" cy="80" r="18"/>
      <path d="M 642,168 V 152 a 32,27 0 0 1 64,0 v 16 z"/>
    </g>
    <g fill="#c98500" stroke="#ffffff" stroke-width="7">
      <circle cx="630" cy="96" r="23"/>
      <path d="M 590,174 V 153 a 40,33 0 0 1 80,0 v 21 z"/>
    </g>
  </g>

  <!-- commits: a run of history down the mainline -->
  <g>
    <path d="M 996,60 V 174" stroke="#cbc3b3" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="996" cy="66"  r="10" fill="#c98500"/>
    <circle cx="996" cy="100" r="10" fill="#4b4b50"/>
    <circle cx="996" cy="134" r="10" fill="#4b4b50"/>
    <circle cx="996" cy="168" r="10" fill="#4b4b50"/>
    <rect x="1018" y="61.5"  width="78" height="9" rx="4.5" fill="#b8b0a0"/>
    <rect x="1018" y="95.5"  width="96" height="9" rx="4.5" fill="#b8b0a0"/>
    <rect x="1018" y="129.5" width="58" height="9" rx="4.5" fill="#b8b0a0"/>
    <rect x="1018" y="163.5" width="84" height="9" rx="4.5" fill="#b8b0a0"/>
  </g>

  <!-- lines of code: a source page -->
  <g>
    <path d="M 1419,54 H 1495 L 1521,80 V 174 H 1419 Z" fill="#f1ece1"/>
    <path d="M 1495,54 L 1521,80 H 1495 Z" fill="#cbc3b3"/>
    <rect x="1435" y="84"  width="54" height="9" rx="4.5" fill="#7a7266"/>
    <rect x="1435" y="104" width="72" height="9" rx="4.5" fill="#b8b0a0"/>
    <rect x="1447" y="124" width="50" height="9" rx="4.5" fill="#c98500"/>
    <rect x="1447" y="144" width="58" height="9" rx="4.5" fill="#b8b0a0"/>
  </g>

  <!-- ================= spine ================= -->
  <path d="M 100,228 H 1580" stroke="#cbc3b3" stroke-width="3" fill="none"/>
  <g fill="#2b2620">
    <circle cx="210"  cy="228" r="7"/>
    <circle cx="630"  cy="228" r="7"/>
    <circle cx="1050" cy="228" r="7"/>
    <circle cx="1470" cy="228" r="7"/>
  </g>

  <!-- ================= figures ================= -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">

    <g font-size="88" fill="#2b2620">
      <text x="210"  y="326">73</text>
      <text x="630"  y="326">120</text>
      <text x="1050" y="326">6,848</text>
      <text x="1470" y="326">564,437</text>
    </g>

    <g font-size="24" fill="#2b2620" letter-spacing="3.2">
      <text x="211.6"  y="372">PROJECTS</text>
      <text x="631.6"  y="372">CONTRIBUTORS</text>
      <text x="1051.6" y="372">COMMITS</text>
      <text x="1471.6" y="372">LINES OF CODE</text>
    </g>

    <g font-size="21" font-style="italic" fill="#7a7266">
      <text x="210"  y="410">Open-source DAS software</text>
      <text x="630"  y="410">Unique commit authors</text>
      <text x="1050" y="410">Full recorded history</text>
      <text x="1470" y="410">Source at repository tip</text>
    </g>

  </g>
</svg>
