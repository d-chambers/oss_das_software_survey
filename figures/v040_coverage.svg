<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1680" height="790" viewBox="0 0 1680 790">
  <title>How the search was run, and where it could not reach</title>
  <desc>212 probes produced 3,200 candidates. Four discovery routes were not taken.</desc>
  <rect x="0" y="0" width="1680" height="790" fill="#ffffff"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
  <text x="841.6" y="64" font-size="24" fill="#2b2620" text-anchor="middle" letter-spacing="3.2">WHAT WAS SEARCHED</text>
  <text x="210" y="164" font-size="76" fill="#2b2620" text-anchor="middle">30</text>
  <text x="211.2" y="202" font-size="21" fill="#2b2620" text-anchor="middle" letter-spacing="2.4">GITHUB QUERIES</text>
  <text x="210" y="234" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">Name, description, README, topic</text>
  <text x="630" y="164" font-size="76" fill="#2b2620" text-anchor="middle">32</text>
  <text x="631.2" y="202" font-size="21" fill="#2b2620" text-anchor="middle" letter-spacing="2.4">GITLAB QUERIES</text>
  <text x="630" y="234" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">Across four hosts</text>
  <text x="1050" y="164" font-size="76" fill="#2b2620" text-anchor="middle">16</text>
  <text x="1051.2" y="202" font-size="21" fill="#2b2620" text-anchor="middle" letter-spacing="2.4">GITEA QUERIES</text>
  <text x="1050" y="234" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">Across two hosts</text>
  <text x="1470" y="164" font-size="76" fill="#c98500" text-anchor="middle">134</text>
  <text x="1471.2" y="202" font-size="21" fill="#2b2620" text-anchor="middle" letter-spacing="2.4">NAMESPACE WALKS</text>
  <text x="1470" y="234" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">Organisations swept end to end</text>
  <text x="841.1" y="292" font-size="17" fill="#7a7266" text-anchor="middle" letter-spacing="2.2">THE QUERIES ASKED FOUR THINGS</text>
  <text x="210" y="330" font-size="19" fill="#2b2620" text-anchor="middle" font-style="italic">“distributed acoustic sensing”</text>
  <text x="210.8" y="356" font-size="15" fill="#a3825a" text-anchor="middle" letter-spacing="1.6">THE PHRASE, AND ITS VARIANTS</text>
  <text x="630" y="330" font-size="19" fill="#2b2620" text-anchor="middle" font-style="italic">Silixa · OptaSense · Febus · Terra15</text>
  <text x="630.8" y="356" font-size="15" fill="#a3825a" text-anchor="middle" letter-spacing="1.6">THE INTERROGATOR VENDORS</text>
  <text x="1050" y="330" font-size="19" fill="#2b2620" text-anchor="middle" font-style="italic">Repository topics</text>
  <text x="1050.8" y="356" font-size="15" fill="#a3825a" text-anchor="middle" letter-spacing="1.6">CURATED LABELS</text>
  <text x="1470" y="330" font-size="19" fill="#2b2620" text-anchor="middle" font-style="italic">MATLAB · Julia · R</text>
  <text x="1470.8" y="356" font-size="15" fill="#a3825a" text-anchor="middle" letter-spacing="1.6">LANGUAGES A PYTHON SEARCH HIDES</text>
  <path d="M 100,410 L 1580,410" stroke="#cbc3b3" stroke-width="3" fill="none"/>
  <circle cx="210" cy="410" r="7" fill="#2b2620"/>
  <circle cx="630" cy="410" r="7" fill="#2b2620"/>
  <circle cx="1050" cy="410" r="7" fill="#2b2620"/>
  <circle cx="1470" cy="410" r="7" fill="#2b2620"/>
  <text x="841.2" y="452" font-size="19" fill="#7a7266" text-anchor="middle" letter-spacing="2.4">7,218 RESULTS · 3,200 DISTINCT CANDIDATES · 5 OF 212 PROBES FAILED</text>
  <text x="841.6" y="536" font-size="24" fill="#2b2620" text-anchor="middle" letter-spacing="3.2">WHAT WAS NOT SEARCHED</text>
  <path d="M 108,576 L 312,576" stroke="#cbc3b3" stroke-width="2.5" fill="none" stroke-dasharray="7 7"/>
  <text x="212.6" y="620" font-size="21" fill="#7a7266" text-anchor="middle" letter-spacing="2.6">THE LITERATURE</text>
  <text x="210" y="654" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">No paper-to-software search.</text>
  <text x="210" y="680" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">Citations were read only for</text>
  <text x="210" y="706" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">projects already catalogued.</text>
  <path d="M 528,576 L 732,576" stroke="#cbc3b3" stroke-width="2.5" fill="none" stroke-dasharray="7 7"/>
  <text x="632.6" y="620" font-size="21" fill="#7a7266" text-anchor="middle" letter-spacing="2.6">SOURCE CODE</text>
  <text x="630" y="654" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">No scan of candidate source for</text>
  <text x="630" y="680" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">interrogator format readers —</text>
  <text x="630" y="706" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">TDMS, OptoDAS, PRODML.</text>
  <path d="M 948,576 L 1152,576" stroke="#cbc3b3" stroke-width="2.5" fill="none" stroke-dasharray="7 7"/>
  <text x="1052.6" y="620" font-size="21" fill="#7a7266" text-anchor="middle" letter-spacing="2.6">PACKAGE REGISTRIES</text>
  <text x="1050" y="654" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">PyPI, conda and the Julia</text>
  <text x="1050" y="680" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">registry were queried only for</text>
  <text x="1050" y="706" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">packages already catalogued.</text>
  <path d="M 1368,576 L 1572,576" stroke="#cbc3b3" stroke-width="2.5" fill="none" stroke-dasharray="7 7"/>
  <text x="1472.6" y="620" font-size="21" fill="#7a7266" text-anchor="middle" letter-spacing="2.6">OTHER HOSTS</text>
  <text x="1470" y="654" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">Institutional and private forges</text>
  <text x="1470" y="680" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">outside the seven, and any</text>
  <text x="1470" y="706" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">source published off-forge.</text>
  <text x="840" y="762" font-size="21" fill="#a3825a" text-anchor="middle" font-style="italic">A tool is invisible here unless it says so in its own name, description, README, or topics.</text>
  </g>
</svg>
