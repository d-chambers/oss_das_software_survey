<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1680" height="520" viewBox="0 0 1680 520">
  <title>What share of DAS software is open source</title>
  <desc>78 catalogued projects and 595,505 lines, grouped by the reuse terms they publish.</desc>
  <rect x="0" y="0" width="1680" height="520" fill="#ffffff"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
  <text x="841.6" y="62" font-size="24" fill="#2b2620" text-anchor="middle" letter-spacing="3.2">WHAT SHARE IS ACTUALLY OPEN SOURCE</text>
  <text x="840" y="102" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">Every catalogued code is counted regardless of licence, so the share can be measured rather than assumed.</text>
  <text x="140" y="176" font-size="20" fill="#2b2620" text-anchor="start" letter-spacing="2.4">BY PROJECT</text>
  <rect x="140" y="202" width="1166.67" height="54" fill="#c98500"/>
  <rect x="1306.67" y="202" width="35.8974" height="54" fill="#e4dccb"/>
  <rect x="1342.56" y="202" width="179.487" height="54" fill="#4b4b50"/>
  <rect x="1522.05" y="202" width="17.9487" height="54" fill="#b8b0a0"/>
  <text x="723.333" y="238" font-size="21" fill="#ffffff" text-anchor="middle">83%</text>
  <text x="1432.31" y="238" font-size="21" fill="#ffffff" text-anchor="middle">13%</text>
  <text x="140" y="288" font-size="19" fill="#7a7266" text-anchor="start" font-style="italic">OSI-approved 65   Source-available 2   No licence 10   Unresolved 1</text>
  <text x="140" y="366" font-size="20" fill="#2b2620" text-anchor="start" letter-spacing="2.4">BY LINE OF CODE</text>
  <rect x="140" y="392" width="1281.23" height="54" fill="#c98500"/>
  <rect x="1421.23" y="392" width="67.766" height="54" fill="#e4dccb"/>
  <rect x="1489" y="392" width="50.9991" height="54" fill="#4b4b50"/>
  <rect x="1540" y="392" width="0" height="54" fill="#b8b0a0"/>
  <text x="780.617" y="428" font-size="21" fill="#ffffff" text-anchor="middle">92%</text>
  <text x="140" y="478" font-size="19" fill="#7a7266" text-anchor="start" font-style="italic">OSI-approved 544,987   Source-available 28,825   No licence 21,693   Unresolved 0</text>
  </g>
</svg>
