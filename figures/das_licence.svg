<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1680" height="520" viewBox="0 0 1680 520">
  <title>What share of DAS software is open source</title>
  <desc>86 catalogued projects and 621,374 lines, grouped by the reuse terms they publish.</desc>
  <rect x="0" y="0" width="1680" height="520" fill="#ffffff"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
  <text x="841.6" y="62" font-size="24" fill="#2b2620" text-anchor="middle" letter-spacing="3.2">WHAT SHARE IS ACTUALLY OPEN SOURCE</text>
  <text x="840" y="102" font-size="19" fill="#7a7266" text-anchor="middle" font-style="italic">Every catalogued code is counted regardless of licence, so the share can be measured rather than assumed.</text>
  <text x="140" y="176" font-size="20" fill="#2b2620" text-anchor="start" letter-spacing="2.4">BY PROJECT</text>
  <rect x="140" y="202" width="1155.81" height="54" fill="#c98500"/>
  <rect x="1295.81" y="202" width="48.8372" height="54" fill="#e4dccb"/>
  <rect x="1344.65" y="202" width="179.07" height="54" fill="#4b4b50"/>
  <rect x="1523.72" y="202" width="16.2791" height="54" fill="#b8b0a0"/>
  <text x="717.907" y="238" font-size="21" fill="#ffffff" text-anchor="middle">83%</text>
  <text x="1434.19" y="238" font-size="21" fill="#ffffff" text-anchor="middle">13%</text>
  <text x="140" y="288" font-size="19" fill="#7a7266" text-anchor="start" font-style="italic">OSI-approved 71   Source-available 3   No licence 11   Unresolved 1</text>
  <text x="140" y="366" font-size="20" fill="#2b2620" text-anchor="start" letter-spacing="2.4">BY LINE OF CODE</text>
  <rect x="140" y="392" width="1225.12" height="54" fill="#c98500"/>
  <rect x="1365.12" y="392" width="113.154" height="54" fill="#e4dccb"/>
  <rect x="1478.27" y="392" width="61.7274" height="54" fill="#4b4b50"/>
  <rect x="1540" y="392" width="0" height="54" fill="#b8b0a0"/>
  <text x="752.559" y="428" font-size="21" fill="#ffffff" text-anchor="middle">88%</text>
  <text x="140" y="478" font-size="19" fill="#7a7266" text-anchor="start" font-style="italic">OSI-approved 543,755   Source-available 50,222   No licence 27,397   Unresolved 0</text>
  </g>
</svg>
