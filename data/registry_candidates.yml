# Candidates discovered by searching PACKAGE REGISTRIES, 2026-08-28.
#
# PROVENANCE: this file is a *proposal*, in the same sense as focus.yml and
# candidate_triage.yml. No script reads it and no script writes it. Discovery
# does not auto-promote and the curated blocks in data/projects/ stay
# human-owned, so nothing here takes effect until someone moves it there by
# hand. Full report, coverage arithmetic and rejections: the session that
# produced this wrote .scratch/registry-search-results.md, which is untracked
# and will not survive; everything load-bearing is repeated here.
#
# WHY THIS FILE EXISTS SEPARATELY FROM candidates.csv. Discovery writes
# snapshots/YYYY-MM-DD/candidates.csv from forge probes and overwrites it on
# every run, so a hand-added row there is lost at the next a010. Its schema is
# also forge-keyed -- `repository`, `forge_kind`, `forge_host` -- and six of
# the entries below have no repository at all. That is not a gap in the record;
# it is the finding.
#
# THE GAP THIS CLOSES. The census had queried PyPI, conda and the Julia
# registry only to look up packages belonging to projects already found, never
# to discover new ones. This is the first discovery pass over registries.
#
# COLLECTION CONSEQUENCE, read before promoting any of these. The pipeline is
# repository-keyed: a020 collects from forge APIs using curated.repository and
# curated.forge.host, and a080 derives repository_url from them. An entry with
# no repository can be catalogued but cannot be *collected* -- it would carry
# registry metrics and nothing else. Deciding what `collected` should look like
# for a source-less package is a curation call nobody has made yet.
#
# VERIFICATION. Every registry_url and repository_url below returned HTTP 200
# on 2026-08-28. Every `evidence` string is copied verbatim from the package's
# own metadata or its shipped README; none is paraphrased. Where a claim rests
# on the distribution's contents rather than its description, `verified_by`
# says which file was opened.
#
# NOT PROPOSED HERE: capabilities and primary_category. Those are a controlled
# vocabulary applied by one reviewer, per data/README.md; guessing them would
# put unreviewed tags into a comparable field.

discovered_at: '2026-08-28'
method: >-
  Full PyPI Simple index sweep (880,040 names, 1,050 JSON records fetched and
  full-text scanned), conda-forge channeldata.json (34,088 packages), Julia
  General Registry.toml (14,237), crandb full dump (24,786), crates.io search
  API, Maven Central solrsearch, npm registry search, NuGet query API, MATLAB
  File Exchange quoted-phrase search, Zenodo API restricted to type=software,
  and the packages.ecosyste.ms cross-registry keyword index (36 keywords).

