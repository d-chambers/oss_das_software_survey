<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1680" height="800" viewBox="0 0 1680 800">
  <title>How much each ecosystem builds on itself</title>
  <desc>DAS: 12 of 60 projects with a packaging manifest depend on another (20%), across 17 edges. Seismology: 167 of 342 (49%), across 192 edges. Both counted from declared manifests only, so both are floors.</desc>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
  <text x="150" y="96" font-size="40" fill="#2b2620" text-anchor="start">DAS</text>
  <text x="150" y="152" font-size="30" fill="#7a7266" text-anchor="start">20% build on another</text>
  <text x="150" y="196" font-size="26" fill="#a3825a" text-anchor="start">12 of 60 projects</text>
  <circle cx="194" cy="250" r="10.1614" fill="#c98500"/>
  <text x="262" y="260" font-size="28" fill="#2b2620" text-anchor="start">DASCore (8 · 13%)</text>
  <circle cx="194" cy="316" r="7" fill="#c98500"/>
  <text x="262" y="326" font-size="28" fill="#2b2620" text-anchor="start">DAS4Whales (2 · 3%)</text>
  <circle cx="194" cy="382" r="7" fill="#c98500"/>
  <text x="262" y="392" font-size="28" fill="#2b2620" text-anchor="start">DASPy (2 · 3%)</text>
  <circle cx="194" cy="448" r="7" fill="#c98500"/>
  <text x="262" y="458" font-size="28" fill="#2b2620" text-anchor="start">xdas (2 · 3%)</text>
  <circle cx="194" cy="514" r="7" fill="#c98500"/>
  <text x="262" y="524" font-size="28" fill="#2b2620" text-anchor="start">DASPack (1 · 2%)</text>
  <circle cx="194" cy="580" r="7" fill="#c98500"/>
  <text x="262" y="590" font-size="28" fill="#2b2620" text-anchor="start">unidas (1 · 2%)</text>
  <circle cx="194" cy="646" r="7" fill="#c98500"/>
  <text x="262" y="656" font-size="28" fill="#2b2620" text-anchor="start">lightguide (1 · 2%)</text>
  <text x="900" y="96" font-size="40" fill="#2b2620" text-anchor="start">Seismology</text>
  <text x="900" y="152" font-size="30" fill="#7a7266" text-anchor="start">49% build on another</text>
  <text x="900" y="196" font-size="26" fill="#a3825a" text-anchor="start">167 of 342 projects</text>
  <circle cx="944" cy="250" r="44" fill="#c98500"/>
  <text x="1012" y="260" font-size="28" fill="#2b2620" text-anchor="start">ObsPy (150 · 44%)</text>
  <circle cx="944" cy="316" r="11.9153" fill="#c98500"/>
  <text x="1012" y="326" font-size="28" fill="#2b2620" text-anchor="start">seisbench (11 · 3%)</text>
  <circle cx="944" cy="382" r="10.7778" fill="#c98500"/>
  <text x="1012" y="392" font-size="28" fill="#2b2620" text-anchor="start">pygmt (9 · 3%)</text>
  <circle cx="944" cy="448" r="9.50509" fill="#c98500"/>
  <text x="1012" y="458" font-size="28" fill="#2b2620" text-anchor="start">pyrocko (7 · 2%)</text>
  <circle cx="944" cy="514" r="7" fill="#c98500"/>
  <text x="1012" y="524" font-size="28" fill="#2b2620" text-anchor="start">obsplus (3 · 1%)</text>
  <circle cx="944" cy="580" r="7" fill="#c98500"/>
  <text x="1012" y="590" font-size="28" fill="#2b2620" text-anchor="start">earthnet-protocol (2 · 1%)</text>
  <circle cx="944" cy="646" r="7" fill="#c98500"/>
  <text x="1012" y="656" font-size="28" fill="#2b2620" text-anchor="start">bruges (1 · 0%)</text>
