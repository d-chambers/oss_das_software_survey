# Proposed triage of the highest-signal unreviewed discovery candidates.
#
# PROVENANCE: this file is a *proposal*, in the same sense as focus.yml. No
# script reads it and no script writes it. Discovery does not auto-promote, and
# the curated blocks in data/projects/ stay human-owned, so nothing here takes
# effect until someone moves it there by hand.
#
# QUEUE: the 2026-08-17 snapshot discovered 3,142 candidates, of which 3,062
# were unreviewed. Reviewing all of them is not the goal; bounding what they
# hide is. This covers the 267 densest of them -- every unreviewed
# candidate whose name or description carries a fiber or DAS token. The
# remaining ~2,792 are sparse strata meant to be *sampled*, not read.
#
# EVIDENCE: each call rests on the repository's own metadata and file tree,
# fetched 2026-08-28: whether it declares an installable package, what it is
# licensed as, whether GitHub reports it as a fork, and how it describes
# itself. Nobody read the source.
#
# THE TEST APPLIED, in order:
#   1. Is it a fork, or already catalogued?        -> duplicate
#   2. Does "das" mean distributed acoustic sensing at all?
#   3. Is there anything published to look at?
#   4. Is it written to accompany a paper, or to teach?
#   5. Does it declare an installable package (pyproject.toml, setup.py,
#      DESCRIPTION, Project.toml, ...)? A requirements.txt or an
#      environment.yml pins an environment for running scripts in place and
#      does not count.
#   6. Only then, which modality is it?
#
# A missing license never excludes anything. This catalogue records reuse terms
# as a countable property, and filtering on them would make "what share of DAS
# software is open source" unanswerable.
#
# CONFIDENCE is about the evidence, not the verdict. `low` means the repository
# publishes no description, so the call leans on file layout alone -- read
# those before trusting them. `medium` marks proposed inclusions, where being
# wrong costs the most. `high` is a fork, an exact duplicate, an empty
# repository, or a hand-checked entry.
#
# REVIEWED 2026-08-28. `proposed` is the rule's call, `decided` is the
# reviewer's. All 267 were ruled on; four were overridden. Entries are grouped
# and counted by `decided`.

counts:
  include: 12
  watchlist-other-fiber: 4
  exclude-duplicate: 21
  exclude-paper-code: 39
  exclude-teaching: 6
  exclude-acronym-collision: 16
  exclude-no-source: 6
  exclude-not-reusable: 162
  undecided: 1
  total: 267

