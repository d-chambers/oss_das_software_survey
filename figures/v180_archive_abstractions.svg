  <title>Two multi-file abstractions</title>
  <desc>Schematic comparison of released DASCore 0.1.21 and Xdas 0.2.8. DASCore indexes file-level patch records in a Spool and materializes one contiguous Patch in memory. xdas maps compatible files into one virtual DataArray and materializes selected chunks. The repeated files and cells are illustrative, not quantitative. Colours are sampled from each release's logo.</desc>
